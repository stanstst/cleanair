<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean Air Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 16px; color: #1f2933; }
    h1 { font-size: 1.5rem; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 24px; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 4px; }
    input, button { font: inherit; padding: 6px 10px; border: 1px solid #cbd2d9; border-radius: 6px; }
    button { background: #2f7d4f; color: #fff; border-color: #2f7d4f; cursor: pointer; }
    .row { padding: 12px 16px; border: 1px solid #e4e7eb; border-radius: 8px; margin-bottom: 12px; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Clean Air Finder</h1>
  <form id="search">
    <label>Date from <input id="date-from" required></label>
    <label>Date to <input id="date-to" required></label>
    <button type="submit">Find</button>
  </form>
  <div id="result"></div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script>
    const today = new Date();
    const yearAgo = new Date(today);
    yearAgo.setFullYear(today.getFullYear() - 1);
    const from = flatpickr('#date-from', { dateFormat: 'Y-m-d', defaultDate: yearAgo });
    const to = flatpickr('#date-to', { dateFormat: 'Y-m-d', defaultDate: today });
    const result = document.getElementById('result');

    function row(text) {
      const div = document.createElement('div');
      div.className = 'row';
      div.textContent = text;
      return div;
    }

    document.getElementById('search').addEventListener('submit', async (event) => {
      event.preventDefault();
      const params = new URLSearchParams({ 'date-from': from.input.value, 'date-to': to.input.value });
      result.replaceChildren();
      try {
        const response = await fetch(`/cleanest-city?${params}`);
        const body = await response.json();
        if (!response.ok) throw new Error(body.error);
        result.append(
          row(`Cleanest City by overall pollution load is: ${body.city}`),
          row(` with ${body.period_max_polution} max pollution ratio and ${body.period_mean_polution} mean pollution ratio`),
        );
      } catch (error) {
        const div = row(error.message);
        div.classList.add('error');
        result.append(div);
      }
    });
  </script>
</body>
</html>
