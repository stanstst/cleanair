apiVersion: batch/v1
kind: Job
metadata:
  generateName: fetcher-backfill-
  namespace: cleanair
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-for-migrate
          image: registry.k8s.io/kubectl:v1.35.1
          args: ["wait", "--for=condition=complete", "job/migrate", "--timeout=600s"]
      containers:
        - name: fetcher-backfill
          image: cleanair-fetcher:local
          imagePullPolicy: IfNotPresent
          command: ["node", "src/job-backfill.js", "--start-date", "START_DATE", "--end-date", "END_DATE"]
          envFrom:
            - configMapRef: {name: cleanair-config}
            - configMapRef: {name: cleanair-db}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: cleanair-secrets, key: MYSQL_PASSWORD}
            - name: OPENAQ_API_KEY
              valueFrom:
                secretKeyRef: {name: cleanair-secrets, key: OPENAQ_API_KEY}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
