apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: cleanair
spec:
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: cleanair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          ports:
            - containerPort: 9091
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
