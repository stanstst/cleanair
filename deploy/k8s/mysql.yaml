apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: cleanair
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: cleanair
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.5
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cleanair-secrets, key: MYSQL_ROOT_PASSWORD}
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: {name: cleanair-db, key: DB_NAME}
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: {name: cleanair-db, key: DB_USER}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: cleanair-secrets, key: MYSQL_PASSWORD}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
