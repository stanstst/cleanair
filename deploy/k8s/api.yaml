apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cleanair
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cleanair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: wait-for-migrate
      initContainers:
        - name: wait-for-migrate
          image: registry.k8s.io/kubectl:v1.35.1
          args: ["wait", "--for=condition=complete", "job/migrate", "--timeout=600s"]
      containers:
        - name: api
          image: cleanair-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: cleanair-config}
            - configMapRef: {name: cleanair-db}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: cleanair-secrets, key: MYSQL_PASSWORD}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
