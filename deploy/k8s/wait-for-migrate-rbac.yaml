apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-migrate
  namespace: cleanair
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-migrate
  namespace: cleanair
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-migrate
  namespace: cleanair
subjects:
  - kind: ServiceAccount
    name: wait-for-migrate
    namespace: cleanair
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wait-for-migrate
