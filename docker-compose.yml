services:
  fetcher:
    build: ./fetcher
    # Keep the container alive so the job can be run on demand:
    #   docker compose exec fetcher node src/job.js
    command: ["sleep", "infinity"]
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    # Mount the source so edits to src/ apply on the next run without a rebuild.
    volumes:
      - ./fetcher/src:/fetcher/src:ro
    depends_on:
      pushgateway:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  archiver:
    build: ./archiver
    # Keep the container alive so the job can be run on demand:
    #   docker compose exec archiver node src/job.js
    command: ["sleep", "infinity"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ARCHIVE_URL: http://fileserver:5000
      ARCHIVE_USER: ${ARCHIVE_USER:-archiver}
      ARCHIVE_PASSWORD: ${ARCHIVE_PASSWORD:-archiver}
    volumes:
      - ./archiver/src:/archiver/src:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      fileserver:
        condition: service_started
    restart: unless-stopped

  fileserver:
    image: sigoden/dufs:v0.47.0
    command:
      - /data
      - --allow-upload
      - --allow-delete
      - -a
      - ${ARCHIVE_USER:-archiver}:${ARCHIVE_PASSWORD:-archiver}@/:rw
      - -a
      - "@/"
    volumes:
      - ./.tmp/archive-files:/data
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: flyway/flyway:11.10.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${MYSQL_USER}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD}
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./mysql/migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "9091:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  mysql-data:
